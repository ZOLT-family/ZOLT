# Railway: run the keeper from keeper/Dockerfile. Set KEEPER_PRIVATE_KEY and ODDS_ADDRESS in the service's variables;
# fund the keeper address with a little ETH on chain 4663 (about 0.0003 ETH a day when quiet).
# (Railway calls this file "config as code"; it keeps working until 2026-12-01, after which .railway/railway.ts takes over.)
[build]
builder = "DOCKERFILE"
dockerfilePath = "keeper/Dockerfile"

[deploy]
restartPolicyType = "ALWAYS"
